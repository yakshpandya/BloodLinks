<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Register a blood donation camp on BloodLinks." />
  <title>Register Blood Camp — BloodLinks</title>
  <link rel="icon" href="https://bloodlinks.in/uploads/app/fav.ico" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" /><link rel="stylesheet" href="extra.css" />
</head>
<body class="page-shell">
  <div id="preloader"><div class="preloader-inner"><div class="preloader-icon">🩸</div><div class="preloader-text">BloodLinks</div></div></div>
  <div id="bl-nav"></div>
  <section class="hero-section">
    <div class="container">
      <nav class="breadcrumb"><a href="index.html"><i class="fas fa-home"></i></a><span><i class="fas fa-chevron-right" style="font-size:.65rem"></i></span><a href="find_camp.html">Blood Camps</a><span><i class="fas fa-chevron-right" style="font-size:.65rem"></i></span><span class="current">Register Camp</span></nav>
      <div class="page-title"><h1>Register <span>Blood Camp</span></h1><p>Organise a blood donation camp and get listed on BloodLinks to attract donors.</p></div>
    </div>
  </section>
  <main class="info-page">
    <div class="container">
      <div class="form-wrapper wide">
        <div class="form-top"><div class="form-icon"><i class="fas fa-campground"></i></div><h1>Blood Camp Registration</h1><p>Your camp will appear on the Find Blood Camps page immediately.</p></div>
        <div class="form-body">
          <div class="form-row">
            <div class="form-group full"><label class="form-label"><i class="fas fa-campground"></i> Camp Name *</label><input type="text" class="form-input" id="c-name" placeholder="Official camp name/title" /></div>
            <div class="form-group"><label class="form-label"><i class="fas fa-building"></i> Organising Body *</label><input type="text" class="form-input" id="c-org" placeholder="Club / NGO / School name" /></div>
            <div class="form-group"><label class="form-label"><i class="fas fa-tag"></i> Type *</label><select class="form-select" id="c-type"><option value="">Select</option><option>Club</option><option>NGO</option><option>Educational Institution</option><option>Corporate</option><option>Government</option><option>Religious</option></select></div>
            <div class="form-group"><label class="form-label"><i class="fas fa-calendar"></i> Camp Date *</label><input type="date" class="form-input" id="c-date" /></div>
            <div class="form-group"><label class="form-label"><i class="fas fa-clock"></i> Timings *</label><input type="text" class="form-input" id="c-time" placeholder="e.g. 9:00 AM - 5:00 PM" /></div>
            <div class="form-group"><label class="form-label"><i class="fas fa-city"></i> City *</label><input type="text" class="form-input" id="c-city" placeholder="City" /></div>
            <div class="form-group"><label class="form-label"><i class="fas fa-map"></i> State *</label><select class="form-select" id="c-state"><option value="">Select state</option><option>Gujarat</option><option>Maharashtra</option><option>Rajasthan</option><option>Delhi</option><option>Karnataka</option><option>Tamil Nadu</option><option>Uttar Pradesh</option><option>West Bengal</option><option>Other</option></select></div>
            <div class="form-group"><label class="form-label"><i class="fas fa-phone"></i> Contact Phone *</label><input type="tel" class="form-input" id="c-phone" placeholder="Contact number" /></div>
            <div class="form-group full"><label class="form-label"><i class="fas fa-map-marker-alt"></i> Venue / Address *</label><input type="text" class="form-input" id="c-addr" placeholder="Full address of the camp venue" /></div>
            <div class="form-group full"><label class="form-label"><i class="fas fa-align-left"></i> Description *</label><textarea class="form-textarea" id="c-desc" placeholder="What to expect, special benefits for donors, refreshments, etc."></textarea></div>
          </div>
          <button class="form-submit" onclick="handleSubmit()"><i class="fas fa-campground"></i> Register Blood Camp</button>
          <div class="form-link">View all camps: <a href="find_camp.html">Find Blood Camps</a></div>
        </div>
      </div>
    </div>
  </main>
  <div id="bl-footer"></div>
  <script src="data.js"></script><script src="db.js"></script><script src="nav.js"></script><script src="app.js"></script>
  <script>
    BloodLinks.initPage({ active: 'camps' });
    function g(id) { return document.getElementById(id) ? document.getElementById(id).value.trim() : ''; }
    function handleSubmit() {
      var name = g('c-name'), org = g('c-org'), type = g('c-type'), date = g('c-date'), time = g('c-time'), city = g('c-city'), state = g('c-state'), phone = g('c-phone'), addr = g('c-addr'), desc = g('c-desc');
      if (!name || !org || !type || !date || !time || !city || !state || !phone || !addr || !desc) { BLDb.toast('Please fill in all required fields.', 'error'); return; }
      var today = new Date(); today.setHours(0,0,0,0);
      if (new Date(date) < today) { BLDb.toast('Camp date cannot be in the past.', 'error'); return; }
      BLDb.addCamp({ name: name, org: org, type: type, date: date, time: time, city: city, state: state, phone: phone, address: addr, location: city + ', ' + state, desc: desc });
      BLDb.toast('Blood camp registered! It now appears on Find Blood Camps.', 'success');
      setTimeout(function () { window.location.href = 'find_camp.html'; }, 1800);
    }
    // Set min date to today
    document.getElementById('c-date').min = new Date().toISOString().split('T')[0];
  </script>
</body>
</html>
