<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Find blood banks near you across India. Search by location, category, or name. BloodLinks — saving lives every day." />
  <title>Find Blood Bank - BloodLinks</title>
  <link rel="icon" href="https://bloodlinks.in/uploads/app/fav.ico" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="extra.css" />
  <style>
    /* Search page card styles */
    .bank-search-card {
      display: block;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      transition: var(--transition);
      animation: fadeInUp 0.4s ease both;
    }
    .bank-search-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-4px);
      box-shadow: var(--shadow-card), 0 0 30px rgba(224,30,55,0.08);
    }
    .bsc-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .bsc-category {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
      padding: 4px 10px; border-radius: 50px;
    }
    .bsc-rating { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--text-secondary); }
    .bsc-rating span { color: var(--white); font-weight: 600; }
    .bsc-name { font-size: 1.05rem; font-weight: 700; color: var(--white); margin-bottom: 8px; line-height: 1.3; }
    .bsc-location { font-size: 0.82rem; color: var(--primary-light); display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
    .bsc-address { font-size: 0.82rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 16px; }
    .bsc-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 14px; border-top: 1px solid var(--border); }
    .bsc-reviews { font-size: 0.78rem; color: var(--text-muted); }
    .bsc-component { font-size: 0.78rem; font-weight: 600; }
    .bsc-component.yes { color: var(--success); }
    .bsc-component.no { color: #e74c3c; }
    .banks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-top: 20px; }
    .search-filters {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      display: grid;
      grid-template-columns: 1fr 220px;
      gap: 16px;
      align-items: end;
    }
    .filter-group label {
      display: block; font-size: 0.78rem; font-weight: 600;
      color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.7px;
      margin-bottom: 8px;
    }
    .filter-input, .filter-select {
      width: 100%; padding: 11px 16px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 0.9rem;
      font-family: 'Inter', sans-serif;
      transition: var(--transition);
      outline: none;
    }
    .filter-input:focus, .filter-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(224,30,55,0.1); }
    .filter-input::placeholder { color: var(--text-muted); }
    .filter-select option { background: var(--bg-card); }
    .results-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 32px; margin-bottom: 8px;
    }
    .results-header h2 { font-size: 1.05rem; font-weight: 700; color: var(--white); }
    .results-header span { font-size: 0.83rem; color: var(--text-muted); }

    /* Hero with stats */
    .find-hero-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-top: 32px;
    }
    .hero-stat-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
      transition: var(--transition);
    }
    .hero-stat-card:hover { border-color: var(--border-hover); }
    .hero-stat-num { font-size: 1.8rem; font-weight: 800; color: var(--white); }
    .hero-stat-num span { color: var(--primary); }
    .hero-stat-label { font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px; }
    @media (max-width: 768px) {
      .search-filters { grid-template-columns: 1fr; }
      .find-hero-cards { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      .find-hero-cards { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <!-- Preloader -->
  <div id="preloader">
    <div class="preloader-inner">
      <div class="preloader-icon">🩸</div>
      <div class="preloader-text">BloodLinks</div>
    </div>
  </div>

  <div id="bl-nav"></div>

  <!-- Hero Section -->
  <section class="hero-section">
    <div class="container">
      <nav class="breadcrumb">
        <a href="index.html"><i class="fas fa-home"></i></a>
        <span><i class="fas fa-chevron-right" style="font-size:0.65rem"></i></span>
        <span class="current">Find Blood Banks</span>
      </nav>
      <div class="page-title">
        <h1>Find <span>Blood Banks</span></h1>
        <p>Search for verified blood banks across India — filter by location, type, and availability.</p>
      </div>
      <div class="find-hero-cards">
        <div class="hero-stat-card">
          <div class="hero-stat-num">5<span>+</span></div>
          <div class="hero-stat-label">Blood Banks</div>
        </div>
        <div class="hero-stat-card">
          <div class="hero-stat-num">8<span>+</span></div>
          <div class="hero-stat-label">Blood Groups</div>
        </div>
        <div class="hero-stat-card">
          <div class="hero-stat-num">24<span>/7</span></div>
          <div class="hero-stat-label">Available</div>
        </div>
        <div class="hero-stat-card">
          <div class="hero-stat-num">100<span>%</span></div>
          <div class="hero-stat-label">Verified</div>
        </div>
      </div>
    </div>
  </section>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container">

      <!-- Filters -->
      <div class="search-filters">
        <div class="filter-group">
          <label for="search-input"><i class="fas fa-search"></i> Search</label>
          <input type="text" id="search-input" class="filter-input" placeholder="Search by name, city, or address..." />
        </div>
        <div class="filter-group">
          <label for="category-filter"><i class="fas fa-filter"></i> Category</label>
          <select id="category-filter" class="filter-select">
            <option value="">All Categories</option>
            <option value="private">Private</option>
            <option value="government">Government</option>
            <option value="trust">Trust</option>
            <option value="ngo">NGO</option>
          </select>
        </div>
      </div>

      <!-- Results -->
      <div class="results-header">
        <h2>All Blood Banks</h2>
        <span>Showing all results</span>
      </div>
      <div class="banks-grid" id="banks-grid">
        <!-- Skeleton loaders -->
        <div class="card"><div class="skeleton" style="height:220px;border-radius:10px"></div></div>
        <div class="card"><div class="skeleton" style="height:220px;border-radius:10px"></div></div>
        <div class="card"><div class="skeleton" style="height:220px;border-radius:10px"></div></div>
      </div>
    </div>
  </main>



  <div id="bl-footer"></div>

  <script src="data.js"></script>
  <script src="db.js"></script>
  <script src="nav.js"></script>
  <script src="app.js"></script>
  <script>
    BloodLinks.initPage({ active: 'blood-banks' });
    var ALL = [];

    function getCatStyle(cat) {
      var c = (cat || '').toLowerCase();
      if (c === 'government') return 'background:rgba(46,204,113,0.12);color:#2ecc71;border:1px solid rgba(46,204,113,0.25)';
      if (c === 'private') return 'background:rgba(90,159,255,0.12);color:#5a9fff;border:1px solid rgba(90,159,255,0.25)';
      if (c === 'trust') return 'background:rgba(155,89,182,0.12);color:#9b59b6;border:1px solid rgba(155,89,182,0.25)';
      return 'background:rgba(243,156,18,0.12);color:#f39c12;border:1px solid rgba(243,156,18,0.25)';
    }

    function render() {
      var search = (document.getElementById('search-input').value || '').toLowerCase();
      var cat = document.getElementById('category-filter').value.toLowerCase();
      var filtered = ALL.filter(function(b) {
        var matchSearch = !search || b.name.toLowerCase().includes(search) || (b.city || b.location || '').toLowerCase().includes(search) || (b.address || '').toLowerCase().includes(search);
        var matchCat = !cat || (b.category || '').toLowerCase() === cat;
        return matchSearch && matchCat;
      });
      var grid = document.getElementById('banks-grid');
      if (!filtered.length) {
        grid.innerHTML = '<div class="card" style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted)"><i class="fas fa-search" style="font-size:2rem;margin-bottom:10px;opacity:0.3;display:block"></i>No blood banks found matching your criteria.</div>';
        return;
      }
      grid.innerHTML = filtered.map(function(b, i) {
        var loc = b.city || b.location || '';
        if (b.state && loc && !loc.includes(b.state)) loc += ', ' + b.state;
        var stars = (b.rating || 4.2).toFixed(1);
        return '<div class="bank-search-card" style="animation-delay:' + (i * 0.05) + 's">' +
          '<div class="bsc-header">' +
            '<span class="bsc-category" style="' + getCatStyle(b.category) + '">' + (b.category || 'General') + '</span>' +
            '<div class="bsc-rating"><i class="fas fa-star" style="color:#f39c12;font-size:0.75rem"></i><span>' + stars + '</span></div>' +
          '</div>' +
          '<div class="bsc-name">' + b.name + '</div>' +
          '<div class="bsc-location"><i class="fas fa-map-marker-alt"></i>' + (loc || 'India') + '</div>' +
          '<div class="bsc-address">' + (b.desc || b.address || 'Registered blood bank providing blood collection and transfusion services.') + '</div>' +
          '<div class="bsc-footer">' +
            '<div class="bsc-reviews"><i class="fas fa-phone" style="margin-right:4px"></i>' + (b.phone || '-') + '</div>' +
            '<div class="bsc-component ' + (b.verified ? 'yes' : 'no') + '"><i class="fas fa-' + (b.verified ? 'check-circle' : 'clock') + '"></i> ' + (b.verified ? 'Verified' : 'Pending') + '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    document.getElementById('search-input').addEventListener('input', render);
    document.getElementById('category-filter').addEventListener('change', render);

    async function loadData() {
      var grid = document.getElementById('banks-grid');
      try {
        ALL = await BLDb.getRegisteredBanks();
        // Update hero stat
        var statEl = document.querySelector('.hero-stat-num');
        if (statEl) statEl.innerHTML = ALL.length + '<span>+</span>';
        render();
      } catch(e) {
        grid.innerHTML = '<div class="card" style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted)">' +
          '<i class="fas fa-exclamation-triangle" style="font-size:2rem;margin-bottom:10px;color:var(--primary);display:block"></i>' +
          '<p>Connection failed. The backend server might be waking up.</p>' +
          '<button onclick="loadData()" class="action-btn primary" style="margin:16px auto;display:inline-flex">' +
          '<i class="fas fa-redo"></i> Retry</button></div>';
      }
    }
    loadData();
  </script>
