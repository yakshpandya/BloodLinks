<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Donor login — BloodLinks." />
  <title>Donor Login — BloodLinks</title>
  <link rel="icon" href="https://bloodlinks.in/uploads/app/fav.ico" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" /><link rel="stylesheet" href="extra.css" />
</head>
<body class="page-shell">
  <div id="preloader"><div class="preloader-inner"><div class="preloader-icon">🩸</div><div class="preloader-text">BloodLinks</div></div></div>
  <div id="bl-nav"></div>
  <main class="login-wrapper">
    <div style="width:100%;max-width:440px;display:flex;flex-direction:column;">
      <nav class="breadcrumb" style="margin-bottom: 20px;"><a href="index.html"><i class="fas fa-home"></i></a><span><i class="fas fa-chevron-right" style="font-size:.65rem"></i></span><span class="current">Donor Login</span></nav>
      <div class="form-wrapper" style="width:100%">
        <div class="form-icon"><i class="fas fa-user-circle"></i></div>
        <h1>Donor Login</h1>
        <p>Sign into your BloodLinks donor account</p>
      </div>
      <div class="form-body">
        <div style="background:rgba(224,30,55,0.07);border:1px solid rgba(224,30,55,0.2);border-radius:10px;padding:12px 16px;margin-bottom:20px;font-size:0.83rem;color:var(--text-secondary)">
          <i class="fas fa-info-circle" style="color:var(--primary)"></i> 
          New here? <a href="register.html" style="color:var(--primary-light);font-weight:600">Register first</a>, then login with your credentials.
        </div>
        <div class="form-group">
          <label class="form-label"><i class="fas fa-envelope"></i> Email Address *</label>
          <input type="email" class="form-input" id="login-email" placeholder="Enter your registered email" />
        </div>
        <div class="form-group">
          <label class="form-label"><i class="fas fa-lock"></i> Password *</label>
          <div style="position:relative">
            <input type="password" class="form-input" id="login-pass" placeholder="Enter your password" style="padding-right:44px" />
            <button type="button" onclick="togglePass()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1rem"><i class="fas fa-eye" id="pass-toggle-icon"></i></button>
          </div>
        </div>
        <div style="display:flex;justify-content:flex-end;margin-bottom:20px">
          <a href="#" style="font-size:0.83rem;color:var(--primary-light)">Forgot password?</a>
        </div>
        <button class="form-submit" id="login-btn" onclick="handleLogin()"><i class="fas fa-sign-in-alt"></i> Sign In</button>
        <div class="form-divider">or</div>
        <div class="form-link">Don't have an account? <a href="register.html">Register here</a></div>
        <div class="form-link" style="margin-top:8px">Are you a blood bank? <a href="admin.html">Blood Bank Login</a></div>
      </div>
    </div>
  </div>
  </main>
  <div id="bl-footer"></div>
  <script src="data.js"></script><script src="db.js"></script><script src="nav.js"></script><script src="app.js"></script>
  <script>
    BloodLinks.initPage({ active: '' });
    if (BLDb.currentUser()) window.location.href = 'dashboard.html';

    function togglePass() {
      var inp = document.getElementById('login-pass');
      var icon = document.getElementById('pass-toggle-icon');
      if (inp.type === 'password') { inp.type = 'text'; icon.className = 'fas fa-eye-slash'; }
      else { inp.type = 'password'; icon.className = 'fas fa-eye'; }
    }

    async function handleLogin() {
      var email = document.getElementById('login-email').value.trim();
      var pass = document.getElementById('login-pass').value;
      if (!email || !pass) { BLDb.toast('Please fill in all fields.', 'error'); return; }

      var btn = document.getElementById('login-btn');
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
      btn.disabled = true;

      try {
        var user = await BLDb.loginDonor(email, pass);
        BLDb.toast('Welcome back, ' + user.firstName + '! Redirecting...', 'success');
        var next = new URLSearchParams(window.location.search).get('next');
        setTimeout(function () { window.location.href = next || 'dashboard.html'; }, 1200);
      } catch (err) {
        BLDb.toast(err.message, 'error');
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
        btn.disabled = false;
      }
    }

    document.addEventListener('keydown', function(e) { if (e.key === 'Enter') handleLogin(); });
  </script>
</body>
</html>
