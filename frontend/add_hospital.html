<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Register your hospital on BloodLinks." />
  <title>Register Hospital — BloodLinks</title>
  <link rel="icon" href="https://bloodlinks.in/uploads/app/fav.ico" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" /><link rel="stylesheet" href="extra.css" />
</head>
<body class="page-shell">
  <div id="preloader"><div class="preloader-inner"><div class="preloader-icon">🩸</div><div class="preloader-text">BloodLinks</div></div></div>
  <div id="bl-nav"></div>
  <section class="hero-section">
    <div class="container">
      <nav class="breadcrumb"><a href="index.html"><i class="fas fa-home"></i></a><span><i class="fas fa-chevron-right" style="font-size:.65rem"></i></span><a href="find_hospital.html">Hospitals</a><span><i class="fas fa-chevron-right" style="font-size:.65rem"></i></span><span class="current">Register Hospital</span></nav>
      <div class="page-title"><h1>Register Your <span>Hospital</span></h1><p>List your hospital to help patients find blood services near them.</p></div>
    </div>
  </section>
  <main class="info-page">
    <div class="container">
      <div class="form-wrapper wide">
        <div class="form-top"><div class="form-icon"><i class="fas fa-hospital"></i></div><h1>Hospital Registration</h1><p>Your listing will appear on the Find Hospitals page immediately after submission.</p></div>
        <div class="form-body">
          <div class="form-row">
            <div class="form-group full"><label class="form-label"><i class="fas fa-hospital"></i> Hospital Name *</label><input type="text" class="form-input" id="h-name" placeholder="Full official name" /></div>
            <div class="form-group"><label class="form-label"><i class="fas fa-tag"></i> Type *</label><select class="form-select" id="h-type"><option value="">Select type</option><option>Government</option><option>Private</option><option>Trust</option><option>Mission</option></select></div>
            <div class="form-group"><label class="form-label"><i class="fas fa-phone"></i> Phone *</label><input type="tel" class="form-input" id="h-phone" placeholder="Contact number" /></div>
            <div class="form-group"><label class="form-label"><i class="fas fa-city"></i> City *</label><input type="text" class="form-input" id="h-city" placeholder="City" /></div>
            <div class="form-group"><label class="form-label"><i class="fas fa-map"></i> State *</label><select class="form-select" id="h-state"><option value="">Select state</option><option>Gujarat</option><option>Maharashtra</option><option>Rajasthan</option><option>Delhi</option><option>Karnataka</option><option>Tamil Nadu</option><option>Uttar Pradesh</option><option>West Bengal</option><option>Other</option></select></div>
            <div class="form-group full"><label class="form-label"><i class="fas fa-map-signed"></i> Full Address *</label><input type="text" class="form-input" id="h-addr" placeholder="Street address" /></div>
            <div class="form-group full"><label class="form-label"><i class="fas fa-check-square"></i> Has Blood Bank?</label><div class="radio-group"><label class="radio-option"><input type="radio" name="h-bb" value="true" checked> Yes</label><label class="radio-option"><input type="radio" name="h-bb" value="false"> No</label></div></div>
            <div class="form-group full"><label class="form-label"><i class="fas fa-align-left"></i> Description *</label><textarea class="form-textarea" id="h-desc" placeholder="Brief description, specialties and facilities..."></textarea></div>
          </div>
          <button class="form-submit" onclick="handleSubmit()"><i class="fas fa-hospital"></i> Register Hospital</button>
          <div class="form-link">View the hospital listing: <a href="find_hospital.html">Find Hospitals</a></div>
        </div>
      </div>
    </div>
  </main>
  <div id="bl-footer"></div>
  <script src="data.js"></script><script src="db.js"></script><script src="nav.js"></script><script src="app.js"></script>
  <script>
    BloodLinks.initPage({ active: 'hospitals' });
    function g(id) { return document.getElementById(id) ? document.getElementById(id).value.trim() : ''; }
    async function handleSubmit() {
      var name = g('h-name'), type = g('h-type'), phone = g('h-phone'), city = g('h-city'), state = g('h-state'), addr = g('h-addr'), desc = g('h-desc');
      if (!name || !type || !phone || !city || !state || !addr || !desc) { BLDb.toast('Please fill in all required fields.', 'error'); return; }
      var bb = document.querySelector('input[name="h-bb"]:checked');
      try {
        await BLDb.addHospital({ name: name, type: type, phone: phone, city: city, state: state, address: addr, location: city + ', ' + state, bloodBank: bb && bb.value === 'true', desc: desc });
        BLDb.toast('Hospital registered successfully! It now appears on Find Hospitals.', 'success');
        setTimeout(function () { window.location.href = 'find_hospital.html'; }, 1800);
      } catch (err) { BLDb.toast('Failed to register hospital.', 'error'); }
    }
  </script>
</body>
</html>
