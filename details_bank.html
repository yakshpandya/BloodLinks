<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Find detailed information about blood banks near you. BloodLinks helps save lives by connecting donors and recipients." />
  <meta name="keywords" content="blood bank, blood donation, donate blood, blood bank details, Gujarat, India" />
  <title>Blood Bank Details - BloodLinks</title>
  <link rel="icon" href="https://bloodlinks.in/uploads/app/fav.ico" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="extra.css" />

  <!-- Search page extra styles -->
  <style>
    /* Search page card styles embedded for this page */
    .bank-search-card {
      display: block;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      transition: var(--transition);
      animation: fadeInUp 0.4s ease both;
    }
    .bank-search-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-4px);
      box-shadow: var(--shadow-card), 0 0 30px rgba(224,30,55,0.08);
    }
    .bsc-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .bsc-category {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
      padding: 4px 10px; border-radius: 50px;
    }
    .bsc-rating { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--text-secondary); }
    .bsc-rating span { color: var(--white); font-weight: 600; }
    .bsc-name { font-size: 1.05rem; font-weight: 700; color: var(--white); margin-bottom: 8px; line-height: 1.3; }
    .bsc-location { font-size: 0.82rem; color: var(--primary-light); display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
    .bsc-address { font-size: 0.82rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 16px; }
    .bsc-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 14px; border-top: 1px solid var(--border); }
    .bsc-reviews { font-size: 0.78rem; color: var(--text-muted); }
    .bsc-component { font-size: 0.78rem; font-weight: 600; }
    .bsc-component.yes { color: var(--success); }
    .bsc-component.no { color: #e74c3c; }
    .banks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .search-filters {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 32px;
      display: grid;
      grid-template-columns: 1fr 220px 180px;
      gap: 16px;
      align-items: end;
    }
    .filter-group label {
      display: block; font-size: 0.78rem; font-weight: 600;
      color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.7px;
      margin-bottom: 8px;
    }
    .filter-input, .filter-select {
      width: 100%; padding: 11px 16px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 0.9rem;
      font-family: 'Inter', sans-serif;
      transition: var(--transition);
      outline: none;
    }
    .filter-input:focus, .filter-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(224,30,55,0.1); }
    .filter-input::placeholder { color: var(--text-muted); }
    .filter-select option { background: var(--bg-card); }
    .search-results-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .search-results-header h2 { font-size: 1.1rem; font-weight: 700; color: var(--white); }
    .search-results-header span { font-size: 0.85rem; color: var(--text-muted); }
    @media (max-width: 768px) {
      .search-filters { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Preloader -->
  <div id="preloader">
    <div class="preloader-inner">
      <div class="preloader-icon">🩸</div>
      <div class="preloader-text">BloodLinks</div>
    </div>
  </div>

  <div id="bl-nav"></div>

  <!-- Hero / Breadcrumb -->
  <section class="hero-section">
    <div class="container">
      <nav class="breadcrumb" aria-label="breadcrumb">
        <a href="index.html"><i class="fas fa-home"></i></a>
        <span><i class="fas fa-chevron-right" style="font-size:0.65rem"></i></span>
        <a href="find_bloodbank.html">Blood Banks</a>
        <span><i class="fas fa-chevron-right" style="font-size:0.65rem"></i></span>
        <span class="current" id="breadcrumb-name">Blood Bank Details</span>
      </nav>
      <div class="page-title">
        <h1><span id="hero-bank-name">Blood Bank</span></h1>
        <p id="hero-bank-location">Loading details...</p>
      </div>
      <div class="hero-stats">
        <div class="hero-stat"><i class="fas fa-phone-alt"></i><span>24/7 Support</span></div>
        <div class="hero-stat"><i class="fas fa-shield-alt"></i><span>Verified & Licensed</span></div>
        <div class="hero-stat"><i class="fas fa-tint"></i><span>All Blood Groups</span></div>
      </div>
    </div>
  </section>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container">
      <div class="content-grid">
        <!-- Left Column - Bank Details -->
        <div id="bank-details-container">
          <!-- Dynamically injected by app.js -->
          <div class="card">
            <div style="padding: 40px; text-align:center;">
              <div class="skeleton" style="height:24px;width:60%;margin:0 auto 16px"></div>
              <div class="skeleton" style="height:16px;width:80%;margin:0 auto 10px"></div>
              <div class="skeleton" style="height:16px;width:70%;margin:0 auto"></div>
            </div>
          </div>
        </div>

        <!-- Right Column - Sidebar -->
        <aside id="sidebar-container" class="sidebar">
          <!-- Dynamically injected by app.js -->
          <div class="sidebar-card">
            <div style="padding: 24px;">
              <div class="skeleton" style="height:22px;width:50%;margin-bottom:16px"></div>
              <div class="skeleton" style="height:44px;margin-bottom:10px;border-radius:10px"></div>
              <div class="skeleton" style="height:44px;margin-bottom:10px;border-radius:10px"></div>
              <div class="skeleton" style="height:44px;border-radius:10px"></div>
            </div>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <div id="bl-footer"></div>

  <!-- App Script -->
  <script src="data.js"></script>
  <script src="nav.js"></script>
  <script src="app.js"></script>
  <script>BloodLinks.initPage({ active: 'blood-banks' });</script>
</body>
</html>
